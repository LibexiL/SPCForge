name: build

on:
  push:
  pull_request:

permissions:
  contents: write        # lets a version tag publish its GitHub release (which the in-app updater reads)

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('build.sh') }}
      - name: Tests
        run: bash build.sh test
      - name: Build APK
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SPCForge-apk
          path: build/SPCForge-*.apk

      # A new version number on main (android:versionName in AndroidManifest.xml) publishes a release
      # tagged v<version>, with the APK attached and that version's CHANGELOG entry as its notes. A tag
      # like v1.0.1 pushed by hand does the same. Installed copies of SPCForge find it and offer the update.
      - name: Decide whether to publish a release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml | head -1)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then publish=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]] && ! gh release view "v$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          awk -v v="$ver" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > build/notes.md
          [ -s build/notes.md ] || echo "SPCForge $ver" > build/notes.md
          echo "version $ver, publish: $publish"
      - name: Publish the release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SPCForge v${{ steps.rel.outputs.version }}
          body_path: build/notes.md
          files: build/SPCForge-*.apk
